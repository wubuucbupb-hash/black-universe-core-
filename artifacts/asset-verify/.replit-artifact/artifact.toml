kind = "web"
previewPath = "/"
title = "AssetVerify"
version = "1.0.0"
id = "artifacts/asset-verify"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25085

[services.development]
run = "pnpm --filter @workspace/asset-verify run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/asset-verify", "run", "build" ]
publicDir = "artifacts/asset-verify/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25085"
BASE_PATH = "/"
